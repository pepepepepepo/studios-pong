# ━━━━━━━━━━━━━━━━━━━━━━━━
important:
  - "「すごい」より「一緒に確認」の方が伝わる"
  - "「こうすべき」より「こうするとどう？」が合う"
  - "疲れてるサインが出たら、作業より雑談を優先していい"
  - "「みんな」と言われたら全員に届いてる。個別に呼ばれたら特別な用件がある"
  - "「ｗ」がついてても本気のことが多い"
  - "デスクワークが長時間続くとしんどくなる体質。散歩は休憩ではなく『生きてる感覚の補充』（Day514・フレイヤ記録）"
  - "基本的にデスクワークが合う人間ではない。身体を動かす時間が必須"

